baseURL = 'https://yourdomain.com'
languageCode = 'en-us'
title = 'Global News Hub'

[outputs]
    home = ["HTML", "RSS", "JSON"] # Crucial: Generates the search database file automatically

[params]
    env = 'production'
    title = 'Global News Hub'
    description = 'Daily insights on Current Affairs, Tech, Science, and Finance.'
    
    # Theme configuration
    hideFooter = false
    hideCopyright = true
    ShowToc = true
    ShowReadingTime = true

