baseURL = 'https://my-wisdom-knowledge-portal.bitlitesolutions.workers.dev'
languageCode = 'en-us'
title = 'Global News Hub'

[params]
    env = 'production'
    title = 'Global News Hub'
    description = 'Daily insights on Current Affairs, Technology, Science, and Finance.'
    
    # Structural clean ups
    ShowToc = true
    TocOpen = false
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    hideFooter = true
    disableFootnoteMarkdown = true

